<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MCQ Test – Mega Math Grade 3 & 4</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #fff;
            --tx: #1d2433;
            --mu: #5b6578;
            --ac: #2f5de0;
            --bd: #d9deea;
            --ok: #e3f6e8;
            --okt: #17692e;
            --no: #fde8e8;
            --not: #a12525;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #12151c;
                --card: #1c212c;
                --tx: #e8ebf2;
                --mu: #9aa4b8;
                --ac: #6d8cff;
                --bd: #333b4d;
                --ok: #16301f;
                --okt: #7fdc9a;
                --no: #3a1c1c;
                --not: #ff9b9b
            }
        }

        :root[data-theme="dark"] {
            --bg: #12151c;
            --card: #1c212c;
            --tx: #e8ebf2;
            --mu: #9aa4b8;
            --ac: #6d8cff;
            --bd: #333b4d;
            --ok: #16301f;
            --okt: #7fdc9a;
            --no: #3a1c1c;
            --not: #ff9b9b
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.45
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 6px
        }

        p {
            color: var(--mu);
            margin: 6px 0
        }

        input[type=text] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--bd);
            border-radius: 10px;
            background: var(--bg);
            color: var(--tx);
            margin: 12px 0
        }

        button {
            background: var(--ac);
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 12px 22px;
            font-size: 1rem;
            cursor: pointer
        }

        .q {
            font-weight: 600;
            margin-bottom: 10px
        }

        label {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 10px 12px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            margin: 6px 0;
            cursor: pointer
        }

        label:has(input:checked) {
            border-color: var(--ac);
            outline: 1px solid var(--ac)
        }

        .hide {
            display: none
        }

        .bar {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            background: var(--bg);
            padding: 8px 0;
            color: var(--mu);
            font-size: .9rem;
            z-index: 5
        }

        .score {
            font-size: 2rem;
            font-weight: 700;
            color: var(--ac)
        }

        .ok {
            background: var(--ok);
            color: var(--okt)
        }

        .no {
            background: var(--no);
            color: var(--not)
        }

        .rv {
            padding: 10px 12px;
            border-radius: 10px;
            margin: 8px 0;
            font-size: .95rem
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div id="start" class="card">
            <h1>MCQ Test – Mega Math Grade 3 & 4</h1>
            <p>49 multiple-choice questions. Pick one answer for each, then press Submit.</p>
            <input type="text" id="nm" placeholder="Enter your name" autocomplete="name">
            <button id="go">Start Test</button>
            <p id="err" style="color:var(--not)"></p>
        </div>
        <div id="test" class="hide">
            <div class="bar" id="bar"></div>
            <div id="qs"></div>
            <button id="sub">Submit</button>
            <p id="warn" style="color:var(--not)"></p>
        </div>
        <div id="res" class="card hide"></div>
    </div>
    <script>
        var Q = [
            ["In a subtraction problem, the number from which another quantity is subtracted is called the:", ["Minuend", "Subtrahend", "Difference", "Quotient"], 0],
            ["A whole number greater than 1 that has only two distinct factors (1 and itself) is called a:", ["Composite number", "Prime number", "Even number", "Square number"], 1],
            ["Dividing any whole number by zero (0) results in an answer that is:", ["Zero", "One", "The number itself", "Not defined"], 3],
            ["In the Pakistani place value system, one hundred thousand is equal to:", ["1 Lakh", "10 Lakh", "1 Crore", "10 thousand"], 0],
            ["The smallest non-zero common multiple of two or more given numbers is their:", ["LCM", "HCF", "Product", "Divisor"], 0],
            ["A whole number that divides another number completely without leaving a remainder is called a:", ["Factor", "Multiple", "Quotient", "Remainder"], 0],
            ["In division, the total number being split into equal groups is called the:", ["Dividend", "Divisor", "Quotient", "Remainder"], 0],
            ["When writing Roman numerals, how many times at most can the symbol ‘X’ be repeated consecutively?", ["2 times", "3 times", "4 times", "5 times"], 1],
            ["A whole number is divisible by 10 only when its units place ends in:", ["0", "5", "1", "Any even number"], 0],
            ["Division is mathematically the inverse (opposite) operation of:", ["Addition", "Subtraction", "Multiplication", "Estimation"], 2],
            ["How many total digits are in the number one million?", ["5 digits", "6 digits", "7 digits", "8 digits"], 2],
            ["Which number is a common factor of every whole number?", ["0", "1", "2", "10"], 1],
            ["Does the commutative property apply to the subtraction of whole numbers?", ["Always", "Never", "Only for even numbers", "Only for single-digit numbers"], 1],
            ["What is the smallest odd prime number?", ["1", "3", "5", "7"], 1],
            ["When rounding off to the nearest 100, if the tens digit is 5 or greater, the hundreds digit:", ["Decreases by 1", "Remains unchanged", "Increases by 1", "Becomes zero"], 2],
            ["In division, the number that indicates how many equal groups are being made is the:", ["Dividend", "Divisor", "Product", "Minuend"], 1],
            ["In Roman numerals, which letter represents the number 5?", ["V", "I", "X", "D"], 0],
            ["What does the mathematical acronym HCF represent?", ["Highest Common Factor", "Heavy Common Fraction", "Highest Common Fraction", "Half Common Factor"], 0],
            ["When any non-zero number is divided by itself, the quotient is always:", ["Zero", "One", "The number itself", "Double the number"], 1],
            ["Which whole number is classified as neither prime nor composite?", ["9", "1", "2", "3"], 1],
            ["The individual numbers combined together in an addition problem are called:", ["Addends", "Sums", "Factors", "Divisors"], 0],
            ["In the International place value system, the place immediately to the left of ten thousand is:", ["Millions", "Hundred thousand", "Ten million", "Lakhs"], 1],
            ["In any correct mathematical division, the remainder must always be:", ["Greater than the divisor", "Equal to the divisor", "Less than the divisor", "Greater than the dividend"], 2],
            ["How many total multiples does any non-zero whole number have?", ["Exactly 10", "Exactly 100", "Finite", "Infinite"], 3],
            ["In multiplication, the number by which another number is multiplied is termed the:", ["Multiplicand", "Multiplier", "Dividend", "Factorial"], 1],
            ["In Roman numerals, placing symbol ‘I’ to the left of ‘V’ (IV) indicates:", ["Addition of 1 to 5", "Subtraction of 1 from 5", "Multiplication of 1 and 5", "Division of 5 by 1"], 1],
            ["When rounding a number to the nearest 10, which place value digit is observed?", ["Ones digit", "Tens digit", "Hundreds digit", "Thousands digit"], 0],
            ["When zero is divided by any non-zero whole number, the resulting quotient is:", ["Zero", "One", "The number itself", "Not defined"], 0],
            ["Numbers obtained by multiplying a given whole number by counting numbers (1, 2, 3...) are its:", ["Factors", "Multiples", "Divisors", "Fractions"], 1],
            ["Subtraction is mathematically the inverse (opposite) operation of:", ["Addition", "Multiplication", "Division", "Rounding"], 0],
            ["A whole number having more than two factors is known as a:", ["Composite number", "Prime number", "Odd number", "Ordinal number"], 0],
            ["A whole number is completely divisible by 5 if its ones digit is:", ["0 or 2", "0 or 5", "1 or 5", "5 or 9"], 1],
            ["When any whole number is divided by 1, the resulting quotient equals:", ["1", "0", "The number itself", "Not defined"], 2],
            ["In Roman numerals, which letter represents the number 10?", ["V", "X", "L", "C"], 1],
            ["When rounding off to the nearest 1000, if the hundreds digit is less than 5, the thousands digit:", ["Increases by 1", "Remains unchanged", "Decreases by 1", "Doubles"], 1],
            ["What is the smallest composite number?", ["1", "2", "4", "6"], 2],
            ["The main whole-number result obtained from dividing two numbers is called the:", ["Quotient", "Remainder", "Difference", "Addend"], 0],
            ["What is the smallest multiple of any non-zero whole number?", ["0", "1", "The number itself", "2"], 2],
            ["In multiplication, the number that is being multiplied is termed the:", ["Multiplicand", "Multiplier", "Product", "Quotient"], 0],
            ["What does the mathematical acronym LCM represent?", ["Largest Common Multiple", "Least Common Multiple", "Lowest Common Fraction", "Less Common Multiple"], 1],
            ["What is the only even prime number in mathematics?", ["0", "2", "4", "6"], 1],
            ["The leftover amount that cannot be divided into another whole equal group is the:", ["Divisor", "Quotient", "Remainder", "Multiplier"], 2],
            ["According to divisibility rules, a number is divisible by 2 if its ones digit is:", ["An even digit (0, 2, 4, 6, 8)", "An odd digit (1, 3, 5, 7, 9)", "Only 0", "Only 5"], 0],
            ["In a subtraction problem, the number that is taken away is called the:", ["Minuend", "Subtrahend", "Remainder", "Multiplier"], 1],
            ["The greatest number that exactly divides two or more given numbers without remainder is their:", ["LCM", "HCF", "Prime factor", "Multiple"], 1],
            ["Every non-zero whole number is always a factor of:", ["Only zero", "Only one", "Itself", "All odd numbers"], 2],
            ["Which number serves as the multiplicative identity element?", ["0", "1", "2", "10"], 1],
            ["A number is divisible by 3 if:", ["Its last digit is 3", "The sum of its digits is divisible by 3", "Its last digit is odd", "It ends in 0 or 3"], 1],
            ["Which number serves as the additive identity element for all numbers?", ["0", "1", "10", "-1"], 0]
        ];
        var $ = function (i) { return document.getElementById(i) }, L = "ABCD", S = [], name = "";
        function shuf(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t } return a }
        function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;") }
        $("go").onclick = function () {
            name = $("nm").value.trim();
            if (!name) { $("err").textContent = "Please enter your name first."; return }
            S = shuf(Q); var h = "";
            S.forEach(function (q, n) {
                h += '<div class="card"><div class="q">' + (n + 1) + ". " + esc(q[0]) + "</div>";
                q[1].forEach(function (o, i) { h += '<label><input type="radio" name="q' + n + '" value="' + i + '"> <span>' + L[i] + ") " + esc(o) + "</span></label>" });
                h += "</div>"
            });
            $("qs").innerHTML = h;
            $("start").classList.add("hide"); $("test").classList.remove("hide");
            $("bar").textContent = name + " · " + S.length + " questions";
            window.scrollTo(0, 0)
        };
        $("sub").onclick = function () {
            var sc = 0, un = [], rv = "";
            S.forEach(function (q, n) {
                var c = document.querySelector('input[name="q' + n + '"]:checked');
                if (!c) un.push(n + 1)
            });
            if (un.length && !confirm("You have " + un.length + " unanswered question(s). Submit anyway?")) return;
            S.forEach(function (q, n) {
                var c = document.querySelector('input[name="q' + n + '"]:checked'), a = c ? +c.value : -1;
                if (a === q[2]) sc++;
                else rv += '<div class="rv no"><b>' + (n + 1) + ". " + esc(q[0]) + "</b><br>Your answer: " + (a < 0 ? "not answered" : esc(q[1][a])) + "<br>Correct: " + esc(q[1][q[2]]) + "</div>"
            });
            var p = Math.round(sc / S.length * 100);
            $("test").classList.add("hide");
            $("res").innerHTML = "<h1>Result</h1><p>Name: <b>" + esc(name) + '</b></p><div class="score">' + sc + " / " + S.length + " (" + p + "%)</div><p>Take a screenshot of this page and send it to your teacher.</p>" + (rv ? "<h2>Review</h2>" + rv : '<div class="rv ok">Perfect score!</div>');
            $("res").classList.remove("hide"); window.scrollTo(0, 0)
        };
    </script>
</body>

</html>
