<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 6px}
p{color:var(--mu);margin:6px 0}
select,input[type=text]{width:100%;padding:12px;font-size:1rem;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:12px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1rem;cursor:pointer}
.q{font-weight:600;margin-bottom:10px}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}
label:has(input:checked){border-color:var(--ac);outline:1px solid var(--ac)}
.hide{display:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;color:var(--mu);font-size:.9rem;z-index:5}
.score{font-size:2rem;font-weight:700;color:var(--ac)}
.ok{background:var(--ok);color:var(--okt)}
.no{background:var(--no);color:var(--not)}
.rv{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:.95rem}

<div class="bar" id="bar"></div>
<div id="qs"></div>
<button id="sub">Submit</button>

</div>
<div id="res" class="card hide"></div>
